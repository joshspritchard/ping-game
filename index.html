<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ping!</title>
  <!-- All the colours and layout live in style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- The job bar: always on screen, shows the current job and where you are -->
  <header id="job-bar">
    <span class="logo">Ping!</span>
    <span id="job-text">No job yet: visit the ticket printer</span>
    <span id="jobs-counter" title="Jobs fixed">✓ 0 / 0</span>
    <span id="location-text">IT Office</span>
  </header>

  <!-- The game area. The canvas and the pop-ups sit on top of each other. -->
  <div id="game-area">
    <!-- The game world gets drawn on this canvas.
         640 x 480 pixels = 20 x 15 tiles of 32 pixels each. -->
    <canvas id="game" width="640" height="480"></canvas>

    <!-- The job sheet: pops up when you collect a job from the ticket printer.
         "hidden" means it starts invisible; tickets.js fills it in and shows it. -->
    <div id="job-sheet" class="paper" hidden>
      <div class="paper-header">
        <span>IT HELPDESK · JOB SHEET</span>
        <span id="sheet-number">#000</span>
      </div>
      <p id="sheet-problem" class="sheet-problem"></p>
      <table class="sheet-details">
        <tr><th>Location</th><td id="sheet-location"></td></tr>
        <tr><th>Device</th><td id="sheet-device"></td></tr>
        <tr><th>Reported by</th><td id="sheet-reported"></td></tr>
      </table>
      <button id="sheet-close">Take the job (E)</button>
    </div>

    <!-- The config screen: pops up when you press E at a device.
         inspect.js fills in the boxes and shows only the rows that fit
         the device (Wi-Fi rows for Wi-Fi devices, cable rows for wired ones). -->
    <form id="inspect-panel" class="screen" hidden>
      <div class="screen-header">
        <span id="insp-name">Device</span>
        <span id="insp-id" class="screen-muted">ID</span>
      </div>
      <p id="insp-owner" class="screen-muted"></p>

      <!-- Two columns: how it connects on the left, IP settings on the right -->
      <div class="screen-columns">
      <div>
      <fieldset class="wifi-only">
        <legend>Wi-Fi</legend>
        <label>Wi-Fi on <input type="checkbox" id="insp-wifi-on"></label>
        <label>Network (SSID)
          <select id="insp-ssid">
            <option>CORP-WIFI</option>
            <option>GUEST-WIFI</option>
          </select>
        </label>
        <label>Password <input type="text" id="insp-password" autocomplete="off" spellcheck="false"></label>
      </fieldset>

      <fieldset class="wired-only">
        <legend>Cable</legend>
        <label>Cable plugged in <input type="checkbox" id="insp-cable"></label>
        <label>Switch port <input type="number" id="insp-port" min="1" max="48"></label>
      </fieldset>

      <fieldset class="ap-only">
        <legend>Access point</legend>
        <label>Power on <input type="checkbox" id="insp-ap-on"></label>
        <p class="screen-muted">Broadcasts: <span id="insp-ssids"></span></p>
      </fieldset>
      </div>

      <fieldset class="ip-only">
        <legend>IP settings</legend>
        <label>IP address
          <select id="insp-ip-mode">
            <option value="dhcp">DHCP (auto)</option>
            <option value="static">Static</option>
          </select>
        </label>
        <label>Static IP <input type="text" id="insp-ip" autocomplete="off" spellcheck="false"></label>
        <label>Subnet mask <input type="text" id="insp-mask" autocomplete="off" spellcheck="false"></label>
        <label>Gateway <input type="text" id="insp-gateway" autocomplete="off" spellcheck="false"></label>
        <label>DNS server <input type="text" id="insp-dns" autocomplete="off" spellcheck="false"></label>
      </fieldset>
      </div>

      <!-- Ping results: what this device can reach right now.
           inspect.js fills this in when the screen opens and after a re-test. -->
      <div id="insp-results" class="screen-results"></div>

      <div class="screen-buttons">
        <button type="button" id="insp-cancel" class="secondary">Close (Esc)</button>
        <button type="submit">Apply and re-test (Enter)</button>
      </div>
    </form>
  </div>

  <!-- Load the game code last, so the canvas above already exists when it runs.
       main.js comes last because it uses functions from the other files. -->
  <script src="js/input.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/network.js"></script>
  <script src="js/tickets.js"></script>
  <script src="js/inspect.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
